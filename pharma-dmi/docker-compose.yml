version: '3.8'

services:
  telemetry-service:
    build:
      context: ./services/TelemetryService
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - telemetry-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/swagger"]
      interval: 30s
      timeout: 10s
      retries: 3

  alert-service:
    build:
      context: ./services/AlertService
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - alert-data:/app/data
    depends_on:
      - telemetry-service

  insight-service:
    build:
      context: ./services/InsightService
      dockerfile: Dockerfile
    ports:
      - "5003:5003"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Open-source AI is enabled by default — no key required.
      # Any of the following overrides will be auto-detected if set on the host:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_URL=${OLLAMA_URL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_MODEL=${HF_MODEL:-meta-llama/Meta-Llama-3-8B-Instruct}
    depends_on:
      - telemetry-service
      - alert-service

  ui:
    image: nginx:alpine
    ports:
      - "4200:80"
    volumes:
      - ./angular-ui:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  telemetry-data:
  alert-data:
